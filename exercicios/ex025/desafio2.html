<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            background-color: lightgrey;
        }

        table {
            width: 400px;
            border-collapse: collapse;
            border: 5px solid black;
        }

        thead th {
            height: 50px;
        }

        th {
            font-family: 'Times New Roman', Times, serif;
            font-size: 20px;
            border: 1px solid black;
            padding: 15px;
            text-align: center;
        }

        td {
            font-family: 'Times New Roman', Times, serif;
            font-size: 20px;
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

         caption {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 35px;
            color: black;
            text-align: center;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.322);
        }
    </style>
</head>
<body>
    <table>
        <caption>
            Materia
        </caption>
        <thead>
            <tr>
                <th rowspan="2" >Àrea</th>
                <th rowspan="2" >Disciplinas</th>
                <th colspan="2">Notas</th>                
                <th rowspan="2">Média</th>
            </tr>

            <tr>
                <th>Nota1</th>
                <th>Nota2</th>
            </tr>

        </thead>
        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td>15</td>
                <td>11</td>
                <td>20</td>
            </tr>

            <tr>
                <td>Física</td>
                <td>22</td>
                <td>12</td>
                <td>10</td>
            </tr>

            <tr>
                <td>Química</td>
                <td>9.0</td>
                <td>7.5</td>
                <td>10</td>
            </tr>

            <tr>
                <td>Biologia</td>
                <td>7.5</td>
                <td>15</td>
                <td>13.1</td>
            </tr>

            <tr>
                <th colspan="4">Média de Exatas</th>
                <td>20.1</td>
            </tr>

            <tr>
                <th rowspan="2">Humanas</th>
                <td>História</td>
                <td>14.4</td>
                <td>15.1</td>
                <td>8</td>
            </tr>

            <tr>
                <td>Geografia</td>
                <td>16</td>
                <td>14.2</td>
                <td>9.3</td>
            </tr>

            <tr>
                <th colspan="4">Média de Humanas</th>
                <td>22</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
