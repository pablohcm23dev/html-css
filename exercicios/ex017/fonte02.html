<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'love story';
            src: url('fontes/love story.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        /*
        Tipos de format()
        -opentype (otf)
        -truetype(ttf)
        -embedded-opentype
        -truetype-aat (Apple 
        advanced typography)
        -svg
        */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'love story', Times, serif;
            font-size: 4em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Titulo de coração love</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Officia impedit quidem, voluptatum, tempora eum nesciunt laboriosam esse a optio ad veniam qui iste! Rem eveniet officiis incidunt deleniti, cum officia.</p>
</body>
</html>
